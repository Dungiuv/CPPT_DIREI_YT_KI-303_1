name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
       uses: actions/checkout@v4

      - name: Set up Java
       uses: actions/setup-java@v4
       with:
         distribution: temurin
         java-version: "21"
         cache: maven

      - name: Show CI build number
       run: echo "CI build ${{ github.run_number }}"

      - name: Validate release tag on Unix
       if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
       run: |
         expected="${GITHUB_REF_NAME#v}"
         actual=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
         test "$expected" = "$actual"

      - name: Validate release tag on Windows
       if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
       shell: pwsh
       run: |
         $expected = $env:GITHUB_REF_NAME.Substring(1)
         $actual = (& .\mvnw.cmd -q help:evaluate -Dexpression=project.version -DforceStdout).Trim()
         if ($expected -ne $actual) { throw "Tag $expected does not match POM version $actual" }

      - name: Test on Unix
       if: runner.os != 'Windows'
       run: ./mvnw -B test

      - name: Test on Windows
       if: runner.os == 'Windows'
       run: .\mvnw.cmd -B test

      - name: Verify on Unix
       if: runner.os != 'Windows'
       run: ./mvnw -B verify

      - name: Verify on Windows
       if: runner.os == 'Windows'
       run: .\mvnw.cmd -B verify

      - name: Package on Unix
       if: runner.os != 'Windows'
       run: ./mvnw -B package

      - name: Package on Windows
       if: runner.os == 'Windows'
       run: .\mvnw.cmd -B package

      - name: Upload JAR
       if: success()
       uses: actions/upload-artifact@v4
       with:
         name: jar-${{ matrix.os }}-${{ github.run_number }}
         path: target/*.jar
         if-no-files-found: error